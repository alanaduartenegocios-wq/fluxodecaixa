<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duarte Flow</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#F7F1E9;color:#561C24}.carregando{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}</style></head><body><div class="carregando" id="carregando"><strong>Duarte Flow</strong><span>Carregando sistema...</span></div><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/alanaduartenegocios-wq/fluxodecaixa/7416039851356b8798f2ba9c51fa60b4232c21f7/index.html',{cache:'no-store'});if(!r.ok)throw Error();let h=await r.text();h=h.replace(/(<section id="pagina-pagar"[\s\S]*?<button)([^>]*)(>\+ Nova conta<\/button>)/,'$1 type="button" data-conta="pagar"$3').replace(/(<section id="pagina-receber"[\s\S]*?<button)([^>]*)(>\+ Nova conta<\/button>)/,'$1 type="button" data-conta="receber"$3');const x=`<div class="modal-bg" id="modalConta" style="display:none"><div class="modal"><h2 id="tituloConta">Nova conta</h2><input id="tipoConta" type="hidden"><div class="form-group"><label id="rotuloConta">Descrição</label><input id="nomeConta" type="text"></div><div class="form-group"><label>Vencimento</label><input id="vencimentoConta" type="date"></div><div class="form-group"><label>Valor (R$)</label><input id="valorConta" type="number" min="0.01" step="0.01"></div><div class="form-group"><label>Status</label><select id="statusConta"></select></div><div class="modal-actions"><button class="btn btn-secondary" type="button" id="cancelarConta">Cancelar</button><button class="btn" type="button" id="salvarConta">Salvar conta</button></div></div></div><script>(()=>{const abrir=t=>{if(!empresaAtual)return alert('Selecione uma empresa primeiro.');const rec=t==='receber';tipoConta.value=t;tituloConta.textContent=rec?'Nova conta a receber':'Nova conta a pagar';rotuloConta.textContent=rec?'Cliente / descrição':'Descrição';nomeConta.value='';valorConta.value='';vencimentoConta.value=new Date().toISOString().slice(0,10);statusConta.innerHTML=rec?'<option value="pendente">Pendente</option><option value="recebido">Recebido</option>':'<option value="pendente">Pendente</option><option value="pago">Pago</option>';modalConta.style.display='flex'};document.addEventListener('click',async e=>{const b=e.target.closest('[data-conta]');if(b){e.preventDefault();abrir(b.dataset.conta);return}if(e.target.closest('#cancelarConta')){modalConta.style.display='none';return}if(!e.target.closest('#salvarConta'))return;const tipo=tipoConta.value,nome=nomeConta.value.trim(),vencimento=vencimentoConta.value,valor=Number(valorConta.value),status=statusConta.value;if(!nome||!vencimento||!valor||valor<=0)return alert('Preencha todos os campos corretamente.');salvarConta.disabled=true;const dados=tipo==='receber'?{cliente_id:empresaAtual,nome_cliente:nome,descricao:nome,valor,vencimento,status}:{cliente_id:empresaAtual,descricao:nome,valor,vencimento,status};const {error}=await supabaseClient.from(tipo==='receber'?'contas_receber':'contas_pagar').insert(dados);salvarConta.disabled=false;if(error){console.error(error);return alert('Não foi possível salvar a conta.')}modalConta.style.display='none';if(tipo==='receber')await carregarContasReceber();else await carregarContasPagar();await carregarDashboard();alert('Conta salva com sucesso!')});const original=abrirPagina;window.abrirPagina=(p,b)=>{original(p,b);if(p==='pagar')carregarContasPagar();if(p==='receber')carregarContasReceber()}})()<\/script>`;h=h.replace('</body>',x+'</body>');document.open();document.write(h);document.close()}catch(e){console.error(e);carregando.innerHTML='<strong>Não foi possível abrir o Duarte Flow.</strong>'}})()</script></body></html>
