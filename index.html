<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duarte Flow</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#F7F1E9;color:#561C24}.carregando{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.carregando strong{font-size:22px}.carregando span{color:#735A57}
</style>
</head>
<body>
<div class="carregando" id="carregando"><strong>Duarte Flow</strong><span>Carregando sistema...</span></div>
<script>
(async function carregarDuarteFlow(){
  const fonte = 'https://raw.githubusercontent.com/alanaduartenegocios-wq/fluxodecaixa/7416039851356b8798f2ba9c51fa60b4232c21f7/index.html';
  try {
    const resposta = await fetch(fonte, { cache: 'no-store' });
    if (!resposta.ok) throw new Error('Não foi possível carregar a base do sistema.');
    let html = await resposta.text();

    html = html.replace(
      '<button class="btn">+ Nova conta</button>',
      '<button type="button" class="btn" onclick="abrirModalConta(\'pagar\')">+ Nova conta</button>'
    );
    html = html.replace(
      '<button class="btn">+ Nova conta</button>',
      '<button type="button" class="btn" onclick="abrirModalConta(\'receber\')">+ Nova conta</button>'
    );

    const modalConta = `
<div class="modal-bg" id="modalConta">
  <div class="modal">
    <h2 id="modalContaTitulo">Nova conta</h2>
    <input type="hidden" id="contaTipo">
    <div class="form-group" id="grupoContaNome">
      <label id="contaNomeLabel" for="contaNome">Descrição</label>
      <input type="text" id="contaNome" placeholder="Informe a descrição">
    </div>
    <div class="form-group">
      <label for="contaVencimento">Vencimento</label>
      <input type="date" id="contaVencimento">
    </div>
    <div class="form-group">
      <label for="contaValor">Valor (R$)</label>
      <input type="number" id="contaValor" min="0.01" step="0.01" placeholder="0,00">
    </div>
    <div class="form-group">
      <label for="contaStatus">Status</label>
      <select id="contaStatus">
        <option value="pendente">Pendente</option>
        <option value="pago">Pago</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="fecharModalConta()">Cancelar</button>
      <button type="button" class="btn" id="btnSalvarConta" onclick="salvarConta()">Salvar conta</button>
    </div>
  </div>
</div>
`;

    html = html.replace('<!-- MODAL LANÇAMENTO -->', modalConta + '\n<!-- MODAL LANÇAMENTO -->');

    const funcoesConta = `
/* CADASTRO DE CONTAS A PAGAR / RECEBER */
function abrirModalConta(tipo) {
    if (!empresaAtual) {
        alert('Selecione uma empresa primeiro.');
        return;
    }

    const ehReceber = tipo === 'receber';
    document.getElementById('contaTipo').value = tipo;
    document.getElementById('modalContaTitulo').textContent = ehReceber ? 'Nova conta a receber' : 'Nova conta a pagar';
    document.getElementById('contaNomeLabel').textContent = ehReceber ? 'Cliente / descrição' : 'Descrição';
    document.getElementById('contaNome').placeholder = ehReceber ? 'Ex.: Cliente Maria' : 'Ex.: Aluguel';
    document.getElementById('contaNome').value = '';
    document.getElementById('contaValor').value = '';
    document.getElementById('contaVencimento').value = new Date().toISOString().split('T')[0];
    document.getElementById('contaStatus').innerHTML = ehReceber
        ? '<option value="pendente">Pendente</option><option value="recebido">Recebido</option>'
        : '<option value="pendente">Pendente</option><option value="pago">Pago</option>';
    document.getElementById('modalConta').style.display = 'flex';
    setTimeout(() => document.getElementById('contaNome').focus(), 50);
}

function fecharModalConta() {
    document.getElementById('modalConta').style.display = 'none';
}

async function salvarConta() {
    const tipo = document.getElementById('contaTipo').value;
    const nome = document.getElementById('contaNome').value.trim();
    const vencimento = document.getElementById('contaVencimento').value;
    const valor = Number(document.getElementById('contaValor').value);
    const status = document.getElementById('contaStatus').value;
    const botao = document.getElementById('btnSalvarConta');

    if (!empresaAtual) {
        alert('Selecione uma empresa primeiro.');
        return;
    }
    if (!nome || !vencimento || !Number.isFinite(valor) || valor <= 0) {
        alert('Preencha a descrição, o vencimento e um valor válido.');
        return;
    }

    botao.disabled = true;
    botao.textContent = 'Salvando...';

    let resposta;
    if (tipo === 'receber') {
        resposta = await supabaseClient.from('contas_receber').insert({
            cliente_id: empresaAtual,
            nome_cliente: nome,
            descricao: nome,
            valor,
            vencimento,
            status
        });
    } else {
        resposta = await supabaseClient.from('contas_pagar').insert({
            cliente_id: empresaAtual,
            descricao: nome,
            valor,
            vencimento,
            status
        });
    }

    botao.disabled = false;
    botao.textContent = 'Salvar conta';

    if (resposta.error) {
        console.error('[Duarte Flow] Erro ao salvar conta:', resposta.error);
        alert('Não foi possível salvar a conta. Verifique os dados e tente novamente.');
        return;
    }

    fecharModalConta();
    if (tipo === 'receber') await carregarContasReceber();
    else await carregarContasPagar();
    await carregarDashboard();
    alert(tipo === 'receber' ? 'Conta a receber adicionada com sucesso!' : 'Conta a pagar adicionada com sucesso!');
}
`;

    html = html.replace('/* CONTAS A PAGAR */', funcoesConta + '\n/* CONTAS A PAGAR */');
    html = html.replace(
      "if (pagina === 'whatsapp') carregarWhatsApp();",
      "if (pagina === 'whatsapp') carregarWhatsApp();\n    if (pagina === 'pagar') carregarContasPagar();\n    if (pagina === 'receber') carregarContasReceber();"
    );

    document.open();
    document.write(html);
    document.close();
  } catch (erro) {
    console.error(erro);
    document.getElementById('carregando').innerHTML = '<strong>Não foi possível abrir o Duarte Flow.</strong><span>Atualize a página e tente novamente.</span>';
  }
})();
</script>
</body>
</html>
