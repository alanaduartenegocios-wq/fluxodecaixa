<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duarte Flow</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#F7F1E9;color:#561C24}.carregando{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}</style></head><body><div class="carregando" id="carregando"><strong>Duarte Flow</strong><span>Carregando sistema...</span></div><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/alanaduartenegocios-wq/fluxodecaixa/7416039851356b8798f2ba9c51fa60b4232c21f7/index.html',{cache:'no-store'});if(!r.ok)throw Error();let h=await r.text();h=h.replace('await atualizarHomeFinanceira(entradas, saidas, data || [], saldoAtual);','');h=h.replace(/(<section id="pagina-pagar"[\s\S]*?<button)([^>]*)(>\+ Nova conta<\/button>)/,'$1$2 type="button" data-conta="pagar"$3').replace(/(<section id="pagina-receber"[\s\S]*?<button)([^>]*)(>\+ Nova conta<\/button>)/,'$1$2 type="button" data-conta="receber"$3');const x=`<div class="modal-bg" id="modalConta" style="display:none"><div class="modal"><h2 id="tituloConta">Nova conta</h2><input id="tipoConta" type="hidden"><div class="form-group"><label id="rotuloConta">Descrição</label><input id="nomeConta" type="text"></div><div class="form-group"><label>Vencimento</label><input id="vencimentoConta" type="date"></div><div class="form-group"><label>Valor (R$)</label><input id="valorConta" type="number" min="0.01" step="0.01"></div><div class="form-group"><label>Status</label><select id="statusConta"></select></div><div class="modal-actions"><button class="btn btn-secondary" type="button" id="cancelarConta">Cancelar</button><button class="btn" type="button" id="salvarConta">Salvar conta</button></div></div></div><script>(()=>{const abrir=t=>{if(!empresaAtual)return alert('Selecione uma empresa primeiro.');const rec=t==='receber';tipoConta.value=t;tituloConta.textContent=rec?'Nova conta a receber':'Nova conta a pagar';rotuloConta.textContent=rec?'Cliente / descrição':'Descrição';nomeConta.value='';valorConta.value='';vencimentoConta.value=new Date().toISOString().slice(0,10);statusConta.innerHTML=rec?'<option value="pendente">Pendente</option><option value="recebido">Recebido</option>':'<option value="pendente">Pendente</option><option value="pago">Pago</option>';modalConta.style.display='flex'};document.addEventListener('click',async e=>{const b=e.target.closest('[data-conta]');if(b){e.preventDefault();abrir(b.dataset.conta);return}if(e.target.closest('#cancelarConta')){modalConta.style.display='none';return}if(!e.target.closest('#salvarConta'))return;const tipo=tipoConta.value,nome=nomeConta.value.trim(),vencimento=vencimentoConta.value,valor=Number(valorConta.value),status=statusConta.value;if(!nome||!vencimento||!valor||valor<=0)return alert('Preencha todos os campos corretamente.');salvarConta.disabled=true;const dados=tipo==='receber'?{cliente_id:empresaAtual,nome_cliente:nome,descricao:nome,valor,vencimento,status}:{cliente_id:empresaAtual,descricao:nome,valor,vencimento,status};const {error}=await supabaseClient.from(tipo==='receber'?'contas_receber':'contas_pagar').insert(dados);salvarConta.disabled=false;if(error){console.error(error);return alert('Não foi possível salvar a conta.')}modalConta.style.display='none';if(tipo==='receber')await carregarContasReceber();else await carregarContasPagar();await carregarDashboard();alert('Conta salva com sucesso!')});const original=abrirPagina;window.abrirPagina=(p,b)=>{original(p,b);if(p==='pagar')carregarContasPagar();if(p==='receber')carregarContasReceber()}})()<\/script><script>(()=>{const carregar=u=>new Promise((ok,erro)=>{if(document.querySelector('script[src="'+u+'"]'))return ok();const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=erro;document.head.appendChild(s)});const painel=document.querySelector('#pagina-fluxo .panel-header');if(!painel)return;const acoes=document.createElement('div');acoes.innerHTML='<input id="arquivoFluxo" type="file" accept=".xlsx,.xls,.csv" hidden><button class="btn btn-secondary" type="button" id="importarFluxo">Importar planilha</button> <button class="btn btn-secondary" type="button" id="exportarExcel">Excel</button> <button class="btn btn-secondary" type="button" id="exportarPdf">PDF</button>';painel.appendChild(acoes);const normalizar=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const obter=async()=>{const r=await supabaseClient.from('lancamentos').select('tipo,descricao,valor,data,forma_pagamento').eq('cliente_id',empresaAtual).order('data',{ascending:false});if(r.error)throw r.error;return r.data||[]};document.getElementById('importarFluxo').onclick=()=>document.getElementById('arquivoFluxo').click();document.getElementById('arquivoFluxo').onchange=async e=>{const arq=e.target.files[0];if(!arq||!empresaAtual)return;try{await carregar('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');const dados=new Uint8Array(await arq.arrayBuffer()),livro=XLSX.read(dados,{type:'array'}),linhas=XLSX.utils.sheet_to_json(livro.Sheets[livro.SheetNames[0]],{defval:''});const registros=linhas.map(l=>{const p=Object.fromEntries(Object.entries(l).map(([k,v])=>[normalizar(k),v]));const tipo=normalizar(p.tipo||p.movimentacao||p.categoria)==='saida'?'saida':'entrada';const valor=Number(String(p.valor||p.valor_r$||p.valor_rs||0).replace(/[^0-9,.-]/g,'').replace(',','.'));const data=p.data||p.data_lancamento||new Date().toISOString().slice(0,10);return {cliente_id:empresaAtual,tipo,descricao:String(p.descricao||p.historico||p.nome||'Importação'),valor,data,forma_pagamento:String(p.forma_pagamento||'Importação'),taxa_percentual:0,origem:'importacao'}}).filter(x=>x.valor>0);if(!registros.length)throw Error('A planilha não possui linhas válidas. Use as colunas Data, Tipo, Descrição e Valor.');const r=await supabaseClient.from('lancamentos').insert(registros);if(r.error)throw r.error;await carregarFluxo();await carregarDashboard();alert(registros.length+' lançamento(s) importado(s) com sucesso.')}catch(err){console.error(err);alert(err.message||'Não foi possível importar a planilha.')}e.target.value=''};document.getElementById('exportarExcel').onclick=async()=>{try{await carregar('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');const dados=await obter();const plan=XLSX.utils.json_to_sheet(dados.map(x=>({Data:x.data,Tipo:x.tipo==='saida'?'Saída':'Entrada',Descrição:x.descricao,Valor:Number(x.valor),Pagamento:x.forma_pagamento||''})));const livro=XLSX.utils.book_new();XLSX.utils.book_append_sheet(livro,plan,'Fluxo de Caixa');XLSX.writeFile(livro,'relatorio-fluxo-caixa.xlsx')}catch(e){alert('Não foi possível gerar o Excel.')}};document.getElementById('exportarPdf').onclick=async()=>{try{await carregar('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');const dados=await obter(),pdf=new jspdf.jsPDF();pdf.setFontSize(16);pdf.text('Relatório - Fluxo de Caixa',14,18);pdf.setFontSize(10);dados.slice(0,45).forEach((x,i)=>pdf.text((x.data||'')+' | '+(x.tipo==='saida'?'Saída':'Entrada')+' | '+(x.descricao||'')+' | R$ '+Number(x.valor||0).toFixed(2),14,30+i*5));pdf.save('relatorio-fluxo-caixa.pdf')}catch(e){alert('Não foi possível gerar o PDF.')}}})();<\/script>`;h=h.replace('</body>',x+'</body>');document.open();document.write(h);document.close()}catch(e){console.error(e);carregando.innerHTML='<strong>Não foi possível abrir o Duarte Flow.</strong>'}})()</script></body></html>
